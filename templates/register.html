{% extends "base.html" %}

{% block title %}Create Account — Chronicle AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="logo-badge mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Create Account</h3>
                    <p class="text-secondary small">Start summarizing and analyzing documents in seconds</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="full_name" class="form-label text-secondary small fw-semibold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control form-control-chronicle" id="full_name" name="full_name" placeholder="Alex Morgan" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control form-control-chronicle" id="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control form-control-chronicle" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-chronicle w-100 py-2 justify-content-center fs-6">
                        <i class="bi bi-lightning-charge-fill"></i> Get Started Free
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                    <p class="text-secondary small mb-0">
                        Already have an account? 
                        <a href="{{ url_for('login') }}" class="text-info fw-semibold">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
